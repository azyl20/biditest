openapi: 3.0.3
info:
  title: Company API
  version: 1.0.0
  description: Example OpenAPI specification with number_of_employees in the request body.
servers:
  - url: https://api.example.com
paths:
  /companies:
    post:
      summary: Create a company
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number_of_employees
              properties:
                number_of_employees:
                  type: string
                  enum:
                    - 2_2
                    - 6_15
                    - 16_25
                    - 26_50
                    - 51_100
                    - 101_150
                    - more_than_150
                  description: The number of employees in the company
                  example: 1_5
      responses:
        '201':
          description: Company created successfully
