    post:
      summary: Check whether a new line loan can be initiated for a contact
      description: >
        Evaluates the contact's ACH debit transaction history to determine
        whether a NewLineLoan application can be submitted. Requires at least 6
        consecutive monthly debits with no gaps greater than 1 month.
      operationId: newLineLoanCanInitiate
      tags:
        - Lenders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
