      tags:
        - Investors
      security:
        - BearerAuth: []
      parameters:
        - name: investor_id
          in: query
          required: true
          schema:
            type: integer
            enum:
              - 1
          description: Investor ID. Currently only investor_id=1 (Nexgen) is supported.
        - name: contact_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the contact to check eligibility for.
        - name: ssn
          in: query
          required: false
          schema:
            type: string
          description: >
            Optional SSN (9 digits). If provided and valid, lookup is performed
            by SSN directly (cached 900s). Otherwise lookup falls back to
            contact demographic matching.
      responses:
        '200':
          description: Investor eligibility result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/InvestorPrequalifyResponse'
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
        '400':
          description: Required parameters missing or invalid investor_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
