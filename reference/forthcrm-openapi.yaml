              required:
                - contact_id
              properties:
                contact_id:
                  type: integer
                  description: ID of the contact to evaluate.
      responses:
        '200':
          description: Eligibility check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      allowed:
                        type: boolean
                        description: Whether a new line loan may be initiated.
                        example: true
                      channel_string:
                        type: string
                        description: >-
                          Pusher channel string for this contact (e.g.
                          "DPP-12345").
                        example: DPP-12345
                        x-generated: true
                  status:
                    $ref: '#/components/schemas/StatusObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
