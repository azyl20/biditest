  /v1/whitelist/ip:
    get:
      summary: List whitelisted IP addresses/CIDR blocks for the current account
      operationId: whitelist_ip_index
      tags:
        - Whitelist
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of whitelisted IP entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WhitelistIp'
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Add an IP address or CIDR block to the whitelist
      operationId: whitelist_ip_store
      tags:
        - Whitelist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ip_address
                - comment
              properties:
                ip_address:
                  type: string
                  description: >
                    IPv4 address or CIDR block. Must be a valid public address —
                    reserved ranges (10.x, 192.168.x, 172.16-31.x, 127.x, 0.x,
                    169.254.x) are rejected.
                  pattern: >-
                    ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                  example: 203.0.113.0/24
                comment:
                  type: string
                  description: Comment/note for this whitelist entry.
      responses:
        '200':
          description: Whitelist IP record created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WhitelistIp'
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
        '400':
          description: Validation error — ip_address missing, malformed, or reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
