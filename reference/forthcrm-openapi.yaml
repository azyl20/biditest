        - BearerAuth: []
      responses:
        '200':
          description: Settlement settings map keyed by setting_key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/SettlementSetting'
                    description: >-
                      Keys are setting_key values (e.g. layout_fields,
                      workflows, workflow_access).
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
        '404':
          description: Settlement settings not found.
  /v1/settlements/settings/getworkflow:
    post:
      operationId: settlementSettingsGetWorkflow
      summary: Get the filtered settlement status workflow for the current user role
      description: >
        Returns the allowed status transitions for the authenticated user based
        on their role and the workflow_access configuration. When workflowtype
        is "restricted", only transitions allowed for the current role are
        returned.
      tags:
        - Settlement Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflows:
                  type: object
                  description: >-
                    Workflow transition map (from-status to array of
                    to-statuses).
                  additionalProperties:
                    type: array
                    items:
                      type: integer
                workflowtype:
                  type: string
                  enum:
                    - restricted
                    - unrestricted
                  description: >-
                    If "restricted", filters transitions by role. Otherwise
                    returns all.
                workflow_access:
                  type: object
                  description: >-
                    Map of status_id to array of role IDs that can access it
                    (used when workflowtype is "restricted").
                  additionalProperties:
                    type: array
                    items:
                      type: integer
      responses:
        '200':
          description: Workflow map filtered for the current user role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: string
                    description: >-
                      Nested map of from_status_id → { to_status_id →
                      status_title }.
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 200
        '404':
          description: No workflow found.
