  /v1/notes_templates/{id}/share:
    post:
      summary: Set sharing for a note template
      description: |
        Replaces the existing sharing configuration for the template.
        Pass `public=1` to share with all users in the account,
        or provide `users` and/or `user_groups` arrays for targeted sharing.
        Returns HTTP 204 on success (no body).
      operationId: notesTemplatesPostShare
      tags:
        - Note Templates
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: 1 to share with all users (ignores users/user_groups).
                users:
                  oneOf:
                    - type: integer
                    - type: array
                      items:
                        type: integer
                  description: User ID(s) to share with.
                user_groups:
                  type: array
                  items:
                    type: integer
                  description: Team/group IDs to share with.
      responses:
        '204':
          description: Sharing configuration saved (no response body).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Error saving sharing configuration.
    get:
      summary: Get sharing configuration for a note template
      operationId: notesTemplatesGetShare
      tags:
        - Note Templates
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Template ID.
          schema:
            type: integer
      responses:
        '200':
          description: Sharing configuration for this template.
          content:
            application/json:
