openapi: 3.0.3
info:
  title: Forth CRM API
  description: REST API for the Forth CRM debt settlement platform.
  version: 1.0.0
  contact:
    name: Forth API Support
    email: api@forthcrm.com
servers:
  - url: https://api.forthcrm.com
    description: Production
security:
  - BearerAuth: []
tags:
  - name: API Metadata
    x-displayName: API Metadata
    description: >-
      Introspection endpoints returning route registrations and API version
      information.
  - name: Authentication
    x-displayName: Authentication
    description: >-
      Obtain and manage API access tokens using the OAuth 2.0 client_credentials
      flow.
  - name: Calendar
    x-displayName: Calendar
    description: Retrieve calendar events and scheduled activities.
  - name: Call Logs
    x-displayName: Call Logs
    description: Log and retrieve inbound and outbound call records for contacts.
  - name: Campaigns
    x-displayName: Campaigns
    description: Manage outbound communication campaigns.
  - name: Capital Partners
    x-displayName: Capital Partners
    description: Manage capital partner (tranche) funding programmes.
  - name: Clixsign
    x-displayName: Clixsign
    description: >-
      Electronic signature endpoints for sending and tracking signature
      requests.
  - name: Companies
    x-displayName: Companies
    description: Manage company (tenant) records and their configuration.
  - name: Company Payees
    x-displayName: Company Payees
    description: Manage payee records associated with a company.
  - name: Contact Alerts
    x-displayName: Contact Alerts
    description: Manage alert flags and notifications attached to a contact record.
  - name: Contact Credit
    x-displayName: Contact Credit
    description: >-
      Retrieve credit report data and Forth Credit integration details for a
      contact.
  - name: Contact Notes
    x-displayName: Contact Notes
    description: Create, retrieve, update, and delete notes attached to a contact.
  - name: Contact Notes (Legacy)
    x-displayName: Contact Notes (Legacy)
    description: Legacy note endpoints for contact records.
  - name: Contact Settings
    x-displayName: Contact Settings
    description: Per-contact configuration and preference settings.
  - name: Contact Settlements
    x-displayName: Contact Settlements
    description: Manage settlement records associated with a specific contact.
  - name: Contact SMS
    x-displayName: Contact SMS
    description: Send SMS messages to contacts and retrieve SMS conversation history.
  - name: Contact Stages
    x-displayName: Contact Stages
    description: Manage the lifecycle stage of a contact.
  - name: Contact Statuses
    x-displayName: Contact Statuses
    description: Retrieve and update the status of a contact record.
  - name: Contact Tasks
    x-displayName: Contact Tasks
    description: Manage tasks assigned to or associated with a contact.
  - name: Contacts
    x-displayName: Contacts
    description: Create, retrieve, update, and search contact records.
  - name: Credit Report Providers
    x-displayName: Credit Report Providers
    description: Retrieve the list of available credit report provider integrations.
  - name: Creditors
    x-displayName: Creditors
    description: Manage creditor records referenced by enrolled debts.
  - name: Data Sources
    x-displayName: Data Sources
    description: Manage data source integrations.
  - name: Debts
    x-displayName: Debts
    description: Manage debt accounts enrolled in a contact's debt settlement programme.
  - name: Document Packages
    x-displayName: Document Packages
    description: Group documents into packages for delivery or signature workflows.
  - name: Documents
    x-displayName: Documents
    description: Upload, retrieve, and manage documents attached to contact records.
  - name: Email Campaigns
    x-displayName: Email Campaigns
    description: Manage email-based outbound communication campaigns.
  - name: Enrollment Plans
    x-displayName: Enrollment Plans
    description: >-
      Define and retrieve the debt settlement plan structure for enrolled
      contacts.
  - name: Enrollment Updates
    x-displayName: Enrollment Updates
    description: Apply updates to an active enrollment.
  - name: Enrollments
    x-displayName: Enrollments
    description: Enroll and manage contacts in debt settlement plans.
  - name: Investors
    x-displayName: Investors
    description: Manage investor records associated with loan and advance programmes.
  - name: Lenders
    x-displayName: Lenders
    description: Manage lender records and associated contacts and advance programs.
  - name: Loans
    x-displayName: Loans
    description: Manage loan products, including MCAs and capital advances.
  - name: Lookups
    x-displayName: Lookups
    description: Retrieve reference data such as states, debt types, and enumerated values.
  - name: My Settings
    x-displayName: My Settings
    description: Retrieve and update the authenticated user's personal settings.
  - name: Note Templates
    x-displayName: Note Templates
    description: Create and manage reusable note templates.
  - name: Notes
    x-displayName: Notes
    description: General notes not tied to a specific contact.
  - name: Notifications
    x-displayName: Notifications
    description: In-app notifications and alert delivery for users.
  - name: Phone Numbers
    x-displayName: Phone Numbers
    description: Look up and validate phone number metadata.
  - name: Roles
    x-displayName: Roles
    description: Define permission roles and assign them to users.
  - name: Send Email
    x-displayName: Send Email
    description: Send transactional emails to contacts.
  - name: Settings
    x-displayName: Settings
    description: Company-wide platform settings and configuration options.
  - name: Settlement Offers
    x-displayName: Settlement Offers
    description: Create and track settlement offers sent to or received from creditors.
  - name: Settlement Settings
    x-displayName: Settlement Settings
    description: Company-level configuration for settlement workflows.
  - name: Settlements
    x-displayName: Settlements
    description: Record and manage settlement agreements negotiated with creditors.
  - name: Signer Types
    x-displayName: Signer Types
    description: Reference list of available signer type values.
  - name: SMS
    x-displayName: SMS
    description: Company-level SMS sending and inbox management.
  - name: SMS Templates
    x-displayName: SMS Templates
    description: Create and manage reusable SMS message templates.
  - name: Tasks
    x-displayName: Tasks
    description: Manage platform-level tasks.
  - name: Teams
    x-displayName: Teams
    description: Create and manage teams for access control and reporting.
  - name: Transactions
    x-displayName: Transactions
    description: Retrieve and manage financial transaction records.
  - name: Users
    x-displayName: Users
    description: Manage user accounts, roles, and access within a company.
  - name: Utilities
    x-displayName: Utilities
    description: General-purpose utility endpoints for formatting and platform health.
  - name: Whitelist
    x-displayName: Whitelist
    description: Internal IP and domain whitelist management.
x-tagGroups:
  - name: Authentication
    tags:
      - Authentication
  - name: Calendar & Tasks
    tags:
      - Calendar
      - Tasks
  - name: Communications
    tags:
      - Call Logs
      - Campaigns
      - Email Campaigns
      - Note Templates
      - Notes
      - Notifications
      - Send Email
      - SMS
      - SMS Templates
  - name: Company
    tags:
      - Companies
      - Company Payees
      - Creditors
      - Data Sources
      - My Settings
      - Settings
  - name: Contacts
    tags:
      - Contact Alerts
      - Contact Credit
      - Contact Notes
      - Contact Notes (Legacy)
      - Contact Settings
      - Contact Settlements
      - Contact SMS
      - Contact Stages
      - Contact Statuses
      - Contact Tasks
      - Contacts
  - name: Debts & Settlements
    tags:
      - Debts
      - Enrollment Plans
      - Enrollment Updates
      - Enrollments
      - Settlement Offers
      - Settlement Settings
      - Settlements
  - name: Documents
    tags:
      - Clixsign
      - Document Packages
      - Documents
      - Signer Types
  - name: Internal
    tags:
      - Whitelist
  - name: Loans & Capital
    tags:
      - Capital Partners
      - Investors
      - Lenders
      - Loans
      - Transactions
  - name: Reference & Lookup
    tags:
      - API Metadata
      - Credit Report Providers
      - Lookups
      - Phone Numbers
      - Utilities
  - name: Users & Teams
    tags:
      - Roles
      - Teams
      - Users
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtained from POST /auth/token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
      description: API key header for machine-to-machine authentication
  parameters:
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: integer
    DebtId:
      name: debt_id
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: doc_id
      in: path
      required: true
      schema:
        type: integer
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    AccountIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: integer
    ClientIdPath:
      name: client_id
      in: path
      required: true
      schema:
        type: integer
    ContactIdPath:
      name: contact_id
      in: path
      required: true
      schema:
        type: integer
    DocId:
      name: doc_id
      in: path
      required: true
      schema:
        type: integer
    LoanId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Success.
    '401':
      $ref: '#/components/responses/Unauthorized'
    Unauthorized:
      description: Unauthorized — missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
    BadRequest:
      description: Bad request — validation error or missing required field
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
    Forbidden:
      description: Forbidden — caller lacks permission to access this resource
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 403
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
  schemas:
    Address:
      type: object
      description: Physical address object
      properties:
        address1:
          type: string
          example: 5982 Murdock Ave
        address2:
          type: string
          nullable: true
          example: Apt. 1
        address3:
          type: string
          nullable: true
          example: Additional address info
        city:
          type: string
          example: Bethel Park
        state:
          type: string
          example: NH
        zip:
          type: string
          example: '15107'
    SecondaryAssignmentCompany:
      type: object
      properties:
        company_type:
          type: string
          example: '284'
        company_id:
          type: string
          example: '84841'
    SecondaryAssignmentRole:
      type: object
      properties:
        role_id:
          type: string
          example: '15203'
        user_id:
          type: string
          example: '7466386'
    SecondaryAssignments:
      type: object
      description: Secondary company/role/team assignments for the contact
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryAssignmentCompany'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryAssignmentRole'
        teams:
          type: array
          items:
            type: string
          example:
            - '11636'
            - '16094'
    BudgetField:
      type: object
      properties:
        id:
          type: string
          example: '12323'
        type:
          type: string
          description: Budget field type code (e.g. LA, E, I, A)
          example: LA
        value:
          type: string
          nullable: true
          example: null
    Contact:
      type: object
      description: A contact (client) record in Forth CRM
      properties:
        object:
          type: string
          enum:
            - contact
          x-generated: true
        id:
          type: string
          x-generated: true
          description: Contact unique identifier
        acctID:
          type: string
          description: Account ID the contact belongs to
          x-generated: true
        business_name:
          type: string
          nullable: true
          example: business_name
        company_id:
          type: string
          description: Company ID within the account
          x-generated: true
        tp_id:
          type: string
          nullable: true
          description: Third-party identifier
          example: '998'
        file_type:
          type: integer
          example: 1
        form_id:
          type: integer
          nullable: true
          example: 8111
        created:
          type: string
          format: date-time
          x-generated: true
        created_by:
          type: string
          nullable: true
          x-generated: true
          description: User ID who created the contact
        modified:
          type: string
          format: date-time
          nullable: true
          x-generated: true
        modified_by:
          type: string
          nullable: true
          x-generated: true
          description: User ID who last modified the contact
        assigned_to:
          type: string
          description: User ID this contact is assigned to
          example: ${user_id}
        secondary_assignments:
          $ref: '#/components/schemas/SecondaryAssignments'
        data_source_id:
          type: string
          nullable: true
        campaign_id:
          type: integer
          nullable: true
          example: 128312
        attorney:
          type: boolean
          description: Whether an attorney is assigned
          example: true
        attorney_id:
          type: integer
          nullable: true
          example: 10045141
        attorney_id2:
          type: integer
          nullable: true
        first_name:
          type: string
          example: Katalon
        middle_name:
          type: string
          nullable: true
          example: Middle
        last_name:
          type: string
          example: API client
        salutation:
          type: string
          nullable: true
          example: Mr.
        title:
          type: string
          nullable: true
          example: Mr.
        phone_number:
          type: string
          nullable: true
          example: '123456789'
        phone_extension:
          type: integer
          nullable: true
          example: 1
        cell_phone:
          type: string
          nullable: true
          example: '123456780'
        cell_extension:
          type: integer
          nullable: true
          example: 2
        work_phone:
          type: string
          nullable: true
          example: '12345678911'
        work_extension:
          type: integer
          nullable: true
          example: 3
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
          nullable: true
          example: katalon@email.com
        social_security_number:
          type: string
          nullable: true
          description: SSN (masked or full depending on permissions)
          example: '999999999'
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: '1980-03-12'
        language:
          type: integer
          nullable: true
          example: 1
        submitted:
          type: boolean
          nullable: true
          example: false
        submitted_by:
          type: integer
          nullable: true
          example: 4637734
        submitted_at:
          type: string
          format: date-time
          nullable: true
        approved_by2:
          type: integer
          nullable: true
          example: 0
        approved_date2:
          type: string
          format: date
          nullable: true
        enrolled:
          type: integer
          nullable: true
          example: null
        enrolled_by:
          type: integer
          nullable: true
        enrolled_date:
          type: string
          format: date
          nullable: true
        returned:
          type: integer
          nullable: true
          example: null
        returned_at:
          type: string
          nullable: true
          example: '0000-00-00 00:00:00'
        rejected:
          type: integer
          nullable: true
          example: null
        rejected_by:
          type: integer
          nullable: true
          example: 0
        rejected_notes:
          type: string
          nullable: true
          example: n/a
        paused_notes:
          type: string
          nullable: true
          example: n/a
        dropped_reason:
          type: integer
          nullable: true
          example: 0
        dropped:
          type: integer
          nullable: true
          example: null
        dropped_date:
          type: string
          format: date
          nullable: true
        graduated:
          type: integer
          nullable: true
          example: null
        grad_date:
          type: string
          format: date
          nullable: true
        total_debt:
          type: number
          format: float
          nullable: true
          example: 12525
        welcome_sent:
          type: string
          format: date-time
          nullable: true
        paper_statements:
          type: boolean
          nullable: true
          example: true
        paper_welcome:
          type: boolean
          nullable: true
          example: true
        gateway_id:
          type: integer
          nullable: true
          example: 1
        gateway_approved_by:
          type: integer
          nullable: true
          example: 0
        paused:
          type: integer
          nullable: true
          example: 0
        gateway_hold:
          type: boolean
          nullable: true
          example: false
        gateway_hold_reason:
          type: integer
          nullable: true
          example: 0
        gateway_hold_notes:
          type: string
          nullable: true
          example: n/a
        gateway_auth_received:
          type: boolean
          nullable: true
          example: true
        gateway_auth_file:
          type: string
          nullable: true
          example: file.pdf
        iscoapp:
          type: boolean
          description: Whether this contact is a co-applicant
          example: false
        statusID:
          type: integer
          nullable: true
        stageID:
          type: integer
          nullable: true
        stage_label:
          type: string
          nullable: true
        status_label:
          type: string
          nullable: true
        status_timestamp:
          type: string
          format: date-time
          nullable: true
        customs:
          type: array
          items: {}
          description: Array of custom field values
          example: []
        linked_coapp:
          type: integer
          nullable: true
          description: ID of linked co-applicant contact
        budget_fields:
          type: array
          items:
            $ref: '#/components/schemas/BudgetField'
          description: Budget field entries for this contact
    ContactInput:
      type: object
      description: Request body for creating or updating a contact
      properties:
        first_name:
          type: string
          example: John
        middle_name:
          type: string
          example: A
        last_name:
          type: string
          example: Doe
        salutation:
          type: string
          example: Mr.
        title:
          type: string
          example: Mr.
        business_name:
          type: string
        company_id:
          type: integer
        assigned_to:
          type: integer
          description: User ID to assign the contact to
        secondary_assignments:
          $ref: '#/components/schemas/SecondaryAssignments'
        file_type:
          type: integer
        form_id:
          type: integer
        campaign_id:
          type: integer
        attorney:
          type: boolean
        attorney_id:
          type: integer
        phone_number:
          type: string
          example: '123456789'
        phone_extension:
          type: integer
        cell_phone:
          type: string
          example: '123456780'
        cell_extension:
          type: integer
        work_phone:
          type: string
          example: '12345678911'
        work_extension:
          type: integer
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
          format: email
        social_security_number:
          type: string
        date_of_birth:
          type: string
          format: date
        language:
          type: integer
        gateway_id:
          type: integer
        total_debt:
          type: number
          format: float
        paper_statements:
          type: boolean
        paper_welcome:
          type: boolean
        statusID:
          type: integer
          description: Lead status ID (triggers status change workflow when updated)
        tp_id:
          type: string
        data_source_id:
          type: integer
        customs:
          type: object
          description: Map of custom field key→value pairs
          additionalProperties: true
        budget_fields:
          type: object
          description: Map of budget field ID→value pairs
          additionalProperties: true
    BulkUpdateContactItem:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
      type: object
      required:
        - contact_id
      properties:
        contact_id:
          type: integer
          description: ID of the contact to update
    BulkUpdateResponse:
      type: object
      description: Result of a bulk update operation
      properties:
        success:
          type: object
          nullable: true
          properties:
            object:
              type: string
              example: contact
            ids:
              type: array
              items:
                type: integer
            message:
              type: string
              example: Updated contacts successfully
        error:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
                description: Contact ID or "empty" if contact_id was missing
              message:
                type: string
    ContactSearchResult:
      type: object
      description: Single result from Elasticsearch contact search
      properties:
        id:
          type: string
          x-generated: true
        firstname:
          type: string
          x-generated: true
        lastname:
          type: string
          x-generated: true
        phone:
          type: string
          x-generated: true
        email:
          type: array
          items:
            type: string
          x-generated: true
        address:
          type: string
          x-generated: true
        city:
          type: string
          x-generated: true
        state:
          type: string
          x-generated: true
        zip:
          type: string
          x-generated: true
        company:
          type: string
          x-generated: true
        ssn:
          type: string
          x-generated: true
        iscoapp:
          type: string
          x-generated: true
          description: String "true" or "false"
        leadstatus:
          type: string
          x-generated: true
        stage:
          type: string
          x-generated: true
        status:
          type: string
          x-generated: true
        enrolled:
          type: string
          x-generated: true
        graduated:
          type: string
          x-generated: true
        dropped:
          type: string
          x-generated: true
        paused:
          type: string
          x-generated: true
        c_type:
          type: string
          x-generated: true
    ContactSearchResponse:
      type: object
      properties:
        total:
          type: integer
          x-generated: true
          description: Total number of results
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContactSearchResult'
        source:
          type: string
          x-generated: true
          description: Elasticsearch index used
        took:
          type: integer
          x-generated: true
          description: Time taken in ms
    EnrollmentStats:
      type: object
      description: Enrollment payment statistics for a contact
      properties:
        gateway:
          type: string
          nullable: true
          description: Custodial gateway name
        num_payments_made:
          type: integer
          description: Number of completed deposit payments
        total_num_payments:
          type: integer
          description: Total active deposit payment schedule entries
        total_fees_paid:
          type: number
          format: float
          description: Sum of completed fee transactions
        total_fees_owed:
          type: number
          format: float
          description: Sum of all active fee transactions
        num_returns:
          type: integer
          description: Number of NSF/return transactions
        num_fees_taken:
          type: integer
          description: Number of completed fee transactions
        total_num_fees:
          type: integer
          description: Total fee transaction count
        sum_of_cleared_payments:
          type: number
          format: float
          description: Sum of cleared deposit transactions (status=4)
        sum_of_payments:
          type: number
          format: float
          description: Sum of active non-voided deposit transactions
    ContactFile:
      type: object
      description: An uploaded document file attached to a contact
      properties:
        object:
          type: string
          enum:
            - contactFile
          x-generated: true
        doc_id:
          type: string
