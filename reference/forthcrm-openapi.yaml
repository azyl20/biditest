  /v1/auth/token:
    post:
      summary: Obtain a long-lived API access token
      description: >
        Authenticates using the OAuth 2.0 **client_credentials** flow.

        Supply `grant_type=client_credentials` along with your `client_id` and
        `client_secret`

        (both available from the API credentials section of the Forth CRM admin
        panel).

        Returns an `access_token` valid for 864000 seconds (10 days).

        This endpoint is exempt from authentication middleware — no prior token
        required.
      operationId: authGetToken
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: API key record ID.
                client_secret:
                  type: string
                  description: API secret associated with the client_id.
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                  description: Must be 'client_credentials'.
              required:
                - client_id
                - client_secret
                - grant_type
      responses:
        '200':
          description: Token issued successfully.
          headers:
            Cache-Control:
              description: no-store (OAuth2 mode only)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: '#/components/schemas/AuthTokenOAuthResponse'
                  status:
                    $ref: '#/components/schemas/ResponseStatus'
        '400':
          description: Unsupported grant_type.
        '401':
          description: Invalid client_id, client_secret, or suspended user.
        '404':
          description: Client not found (legacy mode only).
